spring:
  config:
    activate:
      on-profile: cloud
  datasource:
    # Supabase Direct/Session connection (port 5432, not transaction pooler 6543)
    # Requires sslmode=require for secure cloud communication
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.iitsm: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

