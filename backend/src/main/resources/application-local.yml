spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/servicedesk}
    username: ${SPRING_DATASOURCE_USERNAME:servicedesk_user}
    password: ${SPRING_DATASOURCE_PASSWORD:servicedesk_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.servicedesk: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
