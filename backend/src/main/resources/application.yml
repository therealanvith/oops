spring:
  application:
    name: iitsm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iitsm}
    username: ${SPRING_DATASOURCE_USERNAME:iitsm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:iitsm_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

# Security and CORS configuration properties
app:
  security:
    jwt-secret: ${JWT_SECRET:default_jwt_secret_key_minimum_thirty_two_bytes_long}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

