spring:
  application:
    name: iitsm-backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: -1

app:
  security:
    jwt-secret: test_secret_key_minimum_thirty_two_characters_long_for_unit_tests
    cors:
      allowed-origins: http://localhost:3000

